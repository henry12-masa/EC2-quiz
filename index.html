<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AWSサービス別クイズ</title>
<meta name="description" content="EC2・S3・IAM・VPC・Route 53を学べるAWSサービス別無料クイズ。各カテゴリ100問から50問ランダム出題。">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1 id="pageTitle">AWSサービス別クイズ</h1>
  <p id="pageDesc">EC2・S3・IAM・VPC・Route 53を50問ランダムで学習</p>
</header>

<nav id="quizList"></nav>

<main class="layout">

  <!-- 左広告 -->
  <aside class="ad-box left-ad">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
         crossorigin="anonymous"></script>

    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-8398161859137802"
         data-ad-slot="6325875393"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>

    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

  </aside>

  <!-- クイズ本体 -->
  <section class="quiz-box">

    <div class="status">
      <span id="counter"></span>
      <span id="score"></span>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <h2 id="question"></h2>

    <div id="choices"></div>

    <p id="result"></p>

    <button id="nextBtn">
      次の問題
    </button>

  </section>

  <!-- 右広告 -->
  <aside class="ad-box right-ad">

    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-8398161859137802"
         data-ad-slot="6325875393"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>

    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

  </aside>

</main>

<script src="data/aws-service/ec2.js"></script>
<script src="data/aws-service/s3.js"></script>
<script src="data/aws-service/iam.js"></script>
<script src="data/aws-service/vpc.js"></script>
<script src="data/aws-service/route53.js"></script>

<script src="script.js"></script>

</body>
</html>
